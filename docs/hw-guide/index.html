<title>ソフトでもわかるハード解説</title>
<style>
:root {
  --bg: #f7f7f4; --panel: #ffffff; --text: #1d1f23; --muted: #646a73;
  --line: #dedfd9; --accent: #0b6e4f; --accent-bg: #e3f2ec;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a; --panel: #1d2024; --text: #e4e6e9; --muted: #9299a3;
    --line: #30343a; --accent: #5fd0a5; --accent-bg: #173328;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.85 system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
}
main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 26px; margin: 4px 0 8px; }
.lead { color: var(--muted); margin: 0 0 24px; }
ul.pages { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
ul.pages a {
  display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 14px 16px; color: var(--text); text-decoration: none;
}
ul.pages a:hover { border-color: var(--accent); background: var(--accent-bg); }
ul.pages .name { font-size: 17px; font-weight: 600; color: var(--accent); }
ul.pages .desc { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
</style>
</head>

<main>

</ul>
</main>
