<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreeRTOS API 早見表</title>
<style>
:root {
  --bg: #f7f7f4; --panel: #ffffff; --text: #1d1f23; --muted: #646a73;
  --line: #dedfd9; --accent: #0b6e4f; --accent-bg: #e3f2ec;
  --warn: #9a4a00; --warn-bg: #fdefdc; --no: #a3262b; --no-bg: #fbe6e6;
  --cfg: #3b4a8f; --cfg-bg: #e8ebf8; --code-bg: #f0f1ec; --hit: #fff3b0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a; --panel: #1d2024; --text: #e4e6e9; --muted: #9299a3;
    --line: #30343a; --accent: #5fd0a5; --accent-bg: #173328;
    --warn: #f0b36a; --warn-bg: #3a2a14; --no: #f08a8e; --no-bg: #3a1c1e;
    --cfg: #a9b6f5; --cfg-bg: #232a48; --code-bg: #25292e; --hit: #4a4215;
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.6 system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
}
code, .sig, .name { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
header {
  position: sticky; top: 0; z-index: 10; background: var(--panel);
  border-bottom: 1px solid var(--line); padding: 10px 16px;
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
}
header h1 { font-size: 16px; margin: 0; white-space: nowrap; }
#q {
  flex: 1; min-width: 180px; max-width: 420px; padding: 7px 10px;
  border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--text); font-size: 14px;
}
#q:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.hint { color: var(--muted); font-size: 12px; }
kbd {
  border: 1px solid var(--line); border-radius: 4px; padding: 0 5px;
  font-size: 11px; background: var(--bg);
}
.layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); }
nav {
  position: sticky; top: 53px; align-self: start; height: calc(100vh - 53px);
  overflow-y: auto; padding: 14px 8px 14px 16px; border-right: 1px solid var(--line);
}
nav a {
  display: block; padding: 5px 8px; border-radius: 5px;
  color: var(--text); text-decoration: none; font-size: 13px;
}
nav a:hover { background: var(--accent-bg); color: var(--accent); }
nav a .n { color: var(--muted); font-size: 11px; float: right; }
main { padding: 8px 16px 80px; min-width: 0; }
section { margin-top: 26px; }
section h2 {
  font-size: 17px; margin: 0 0 2px; padding-bottom: 4px;
  border-bottom: 2px solid var(--accent);
}
section h2 small { font-weight: normal; color: var(--muted); font-size: 12px; margin-left: 8px; }
.note { color: var(--muted); font-size: 13px; margin: 6px 0 10px; }
.api {
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 9px 12px; margin-top: 6px;
}
.api:target { outline: 2px solid var(--accent); background: var(--hit); }
.api .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.name { font-weight: 700; font-size: 14px; color: var(--accent); text-decoration: none; }
.name:hover { text-decoration: underline; }
.sig {
  display: block; background: var(--code-bg); border-radius: 4px;
  padding: 4px 8px; margin: 5px 0; font-size: 12.5px;
  overflow-x: auto; white-space: pre;
}
.desc { margin: 0; }
.badge {
  font-size: 11px; padding: 1px 7px; border-radius: 10px; white-space: nowrap;
}
.b-isr { background: var(--warn-bg); color: var(--warn); }
.b-no { background: var(--no-bg); color: var(--no); }
.b-cfg { background: var(--cfg-bg); color: var(--cfg); font-family: ui-monospace, Consolas, monospace; }
.empty { display: none; padding: 30px 0; color: var(--muted); }
.legend { margin: 14px 0 0; font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
@media (max-width: 760px) {
  .layout { display: block; }
  nav {
    position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line);
    display: flex; gap: 4px; overflow-x: auto; padding: 8px 16px; white-space: nowrap;
  }
  nav a .n { display: none; }
  .hint { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>FreeRTOS API 早見表</h1>
  <input id="q" type="search" placeholder="API名・キーワードで絞り込み" autocomplete="off">
  <span class="hint"><kbd>/</kbd> 検索　<kbd>Enter</kbd> 先頭へジャンプ　<kbd>Esc</kbd> 解除</span>
</header>
<div class="layout">
  <nav id="toc"></nav>
  <main>
    <div class="legend">
      <span><span class="badge b-isr">ISR版</span> 割り込みからは FromISR 版を使う</span>
      <span><span class="badge b-no">ISR不可</span> 割り込みから呼べない</span>
      <span><span class="badge b-cfg">config…</span> FreeRTOSConfig.h で有効化が必要</span>
      <span>対象: FreeRTOS Kernel V11 系 / 待ち時間は tick 単位（<code>pdMS_TO_TICKS(ms)</code> で変換）</span>
    </div>
    <div id="content"></div>
    <p class="empty" id="empty">該当する API がありません。</p>
  </main>
</div>
<script>
const DATA = [
{ id: "task", title: "タスク", hdr: "task.h",
  note: "スタックサイズはバイトではなくワード単位（32bit なら ×4 バイト）。スケジューラ起動後に生成したタスクは、優先度が高ければ即座に走り出す。",
  apis: [
  { n: "xTaskCreate", s: "BaseType_t xTaskCreate(TaskFunction_t fn, const char *name, configSTACK_DEPTH_TYPE stackDepth,\n                       void *param, UBaseType_t prio, TaskHandle_t *outHandle)", d: "タスクを動的確保で生成。成功で pdPASS。ハンドル不要なら outHandle は NULL。", isr: "no", cfg: "configSUPPORT_DYNAMIC_ALLOCATION" },
  { n: "xTaskCreateStatic", s: "TaskHandle_t xTaskCreateStatic(TaskFunction_t fn, const char *name, uint32_t stackDepth, void *param,\n                               UBaseType_t prio, StackType_t *stackBuf, StaticTask_t *tcbBuf)", d: "スタックと TCB を呼び出し側が用意して生成。ヒープを使わない。バッファは静的寿命が必要。", isr: "no", cfg: "configSUPPORT_STATIC_ALLOCATION" },
  { n: "vTaskDelete", s: "void vTaskDelete(TaskHandle_t task)", d: "タスクを削除。NULL で自分自身。自分を消した場合のメモリ解放は idle タスクが行う。タスク関数から return してはいけない（最後に必ずこれを呼ぶ）。", isr: "no", cfg: "INCLUDE_vTaskDelete" },
  { n: "vTaskSuspend", s: "void vTaskSuspend(TaskHandle_t task)", d: "タスクを無期限に停止。NULL で自分。vTaskResume されるまで動かない。", isr: "no", cfg: "INCLUDE_vTaskSuspend" },
  { n: "vTaskResume", s: "void vTaskResume(TaskHandle_t task)", d: "サスペンド中のタスクを再開。", isr: "xTaskResumeFromISR", cfg: "INCLUDE_vTaskSuspend" },
  { n: "vTaskPrioritySet", s: "void vTaskPrioritySet(TaskHandle_t task, UBaseType_t newPrio)", d: "優先度を変更。数値が大きいほど高優先度（0 が最低、上限は configMAX_PRIORITIES-1）。", isr: "no", cfg: "INCLUDE_vTaskPrioritySet" },
  { n: "uxTaskPriorityGet", s: "UBaseType_t uxTaskPriorityGet(TaskHandle_t task)", d: "現在の優先度を取得。", isr: "uxTaskPriorityGetFromISR", cfg: "INCLUDE_uxTaskPriorityGet" },
  { n: "xTaskGetCurrentTaskHandle", s: "TaskHandle_t xTaskGetCurrentTaskHandle(void)", d: "実行中タスクのハンドルを取得。", cfg: "INCLUDE_xTaskGetCurrentTaskHandle" },
  { n: "pcTaskGetName", s: "char *pcTaskGetName(TaskHandle_t task)", d: "タスク名を取得。NULL で自分。" },
  { n: "eTaskGetState", s: "eTaskState eTaskGetState(TaskHandle_t task)", d: "状態を取得（eRunning / eReady / eBlocked / eSuspended / eDeleted）。", cfg: "INCLUDE_eTaskGetState" },
  { n: "taskYIELD", s: "taskYIELD()", d: "同優先度の他タスクへ CPU を明け渡す。より低優先度のタスクには渡らない。", isr: "portYIELD_FROM_ISR" },
  { n: "vTaskStartScheduler", s: "void vTaskStartScheduler(void)", d: "スケジューラを起動。正常時は戻らない。idle タスク（と有効ならタイマータスク）もここで作られる。", isr: "no" },
  { n: "xTaskGetSchedulerState", s: "BaseType_t xTaskGetSchedulerState(void)", d: "taskSCHEDULER_NOT_STARTED / RUNNING / SUSPENDED を返す。起動前後で処理を分けるときに使う。", cfg: "INCLUDE_xTaskGetSchedulerState" },
]},
{ id: "time", title: "時間・遅延", hdr: "task.h",
  note: "portMAX_DELAY による無期限待ちは INCLUDE_vTaskSuspend=1 のときだけ本当に無期限になる。",
  apis: [
  { n: "vTaskDelay", s: "void vTaskDelay(TickType_t ticks)", d: "呼んだ時点から相対的に ticks だけブロック。処理時間ぶん周期がずれるので、周期実行には不向き。", isr: "no", cfg: "INCLUDE_vTaskDelay" },
  { n: "xTaskDelayUntil", s: "BaseType_t xTaskDelayUntil(TickType_t *prevWakeTime, TickType_t period)", d: "絶対時刻基準の周期待ち。prevWakeTime は初回だけ xTaskGetTickCount() で初期化し、以降は API が更新する。締め切りを過ぎていて待たなかった場合は pdFALSE。", isr: "no", cfg: "INCLUDE_xTaskDelayUntil" },
  { n: "xTaskGetTickCount", s: "TickType_t xTaskGetTickCount(void)", d: "起動からの tick 数。オーバーフローで 0 に戻る（差分は符号なし減算で求める）。", isr: "xTaskGetTickCountFromISR" },
  { n: "pdMS_TO_TICKS", s: "pdMS_TO_TICKS(ms)", d: "ミリ秒を tick に変換するマクロ。1 tick 未満は 0 に切り捨てられる点に注意。" },
  { n: "xTaskAbortDelay", s: "BaseType_t xTaskAbortDelay(TaskHandle_t task)", d: "ブロック中のタスクを強制的に Ready に戻す。待っていた API はタイムアウト扱いで戻る。", isr: "no", cfg: "INCLUDE_xTaskAbortDelay" },
  { n: "vTaskSetTimeOutState", s: "void vTaskSetTimeOutState(TimeOut_t *timeout)\nBaseType_t xTaskCheckForTimeOut(TimeOut_t *timeout, TickType_t *ticksToWait)", d: "複数回のブロックにまたがる合計タイムアウトを管理する。残り時間が ticksToWait に書き戻される。", isr: "no" },
]},
{ id: "queue", title: "キュー", hdr: "queue.h",
  note: "データはコピーで渡る（ポインタを入れた場合、指す先の寿命は自分で守る）。成功で pdTRUE、満杯/空でタイムアウトすると errQUEUE_FULL / errQUEUE_EMPTY（= pdFALSE）。",
  apis: [
  { n: "xQueueCreate", s: "QueueHandle_t xQueueCreate(UBaseType_t length, UBaseType_t itemSize)", d: "要素数 length、1 要素 itemSize バイトのキューを生成。失敗で NULL。", isr: "no", cfg: "configSUPPORT_DYNAMIC_ALLOCATION" },
  { n: "xQueueCreateStatic", s: "QueueHandle_t xQueueCreateStatic(UBaseType_t length, UBaseType_t itemSize,\n                                 uint8_t *storage, StaticQueue_t *queueBuf)", d: "記憶域を呼び出し側が用意する版。storage は length×itemSize バイト以上。", isr: "no", cfg: "configSUPPORT_STATIC_ALLOCATION" },
  { n: "xQueueSend", s: "BaseType_t xQueueSend(QueueHandle_t q, const void *item, TickType_t ticksToWait)", d: "末尾に追加（xQueueSendToBack と同じ）。満杯なら ticksToWait までブロック。", isr: "xQueueSendFromISR(q, item, &woken)" },
  { n: "xQueueSendToFront", s: "BaseType_t xQueueSendToFront(QueueHandle_t q, const void *item, TickType_t ticksToWait)", d: "先頭に割り込ませて追加。緊急メッセージ用。", isr: "xQueueSendToFrontFromISR(q, item, &woken)" },
  { n: "xQueueReceive", s: "BaseType_t xQueueReceive(QueueHandle_t q, void *buf, TickType_t ticksToWait)", d: "先頭を取り出して buf にコピー。空なら ticksToWait までブロック。", isr: "xQueueReceiveFromISR(q, buf, &woken)" },
  { n: "xQueuePeek", s: "BaseType_t xQueuePeek(QueueHandle_t q, void *buf, TickType_t ticksToWait)", d: "先頭を取り除かずに読む。", isr: "xQueuePeekFromISR(q, buf)" },
  { n: "xQueueOverwrite", s: "BaseType_t xQueueOverwrite(QueueHandle_t q, const void *item)", d: "満杯でも上書きして書き込む。長さ 1 のキュー専用（最新値メールボックス）。", isr: "xQueueOverwriteFromISR(q, item, &woken)" },
  { n: "uxQueueMessagesWaiting", s: "UBaseType_t uxQueueMessagesWaiting(QueueHandle_t q)", d: "格納済みの要素数。", isr: "uxQueueMessagesWaitingFromISR" },
  { n: "uxQueueSpacesAvailable", s: "UBaseType_t uxQueueSpacesAvailable(QueueHandle_t q)", d: "空き要素数。", isr: "no" },
  { n: "xQueueReset", s: "BaseType_t xQueueReset(QueueHandle_t q)", d: "中身を全て捨てて空にする。", isr: "no" },
  { n: "vQueueDelete", s: "void vQueueDelete(QueueHandle_t q)", d: "キューを破棄。待っているタスクがいる状態で消してはいけない。", isr: "no" },
  { n: "xQueueCreateSet", s: "QueueSetHandle_t xQueueCreateSet(UBaseType_t eventQueueLength)\nBaseType_t xQueueAddToSet(QueueSetMemberHandle_t member, QueueSetHandle_t set)\nQueueSetMemberHandle_t xQueueSelectFromSet(QueueSetHandle_t set, TickType_t ticksToWait)", d: "複数のキュー/セマフォをまとめて待つキューセット。Select が返したメンバーから必ず受信すること。", isr: "no", cfg: "configUSE_QUEUE_SETS" },
]},
{ id: "sem", title: "セマフォ", hdr: "semphr.h",
  note: "Take / Give はバイナリ・カウンティング・ミューテックスで共通。バイナリセマフォは優先度継承なし（通知・同期用）。排他にはミューテックスを使う。",
  apis: [
  { n: "xSemaphoreCreateBinary", s: "SemaphoreHandle_t xSemaphoreCreateBinary(void)", d: "バイナリセマフォを生成。初期状態は「空」（先に Give しないと Take できない）。", isr: "no" },
  { n: "xSemaphoreCreateCounting", s: "SemaphoreHandle_t xSemaphoreCreateCounting(UBaseType_t maxCount, UBaseType_t initialCount)", d: "カウンティングセマフォを生成。イベント回数の計数やリソース個数の管理に使う。", isr: "no", cfg: "configUSE_COUNTING_SEMAPHORES" },
  { n: "xSemaphoreTake", s: "BaseType_t xSemaphoreTake(SemaphoreHandle_t s, TickType_t ticksToWait)", d: "取得。取れなければ ticksToWait までブロック。タイムアウトで pdFALSE（戻り値を必ず確認）。", isr: "xSemaphoreTakeFromISR(s, &woken)" },
  { n: "xSemaphoreGive", s: "BaseType_t xSemaphoreGive(SemaphoreHandle_t s)", d: "解放。既に満杯なら pdFALSE。", isr: "xSemaphoreGiveFromISR(s, &woken)" },
  { n: "uxSemaphoreGetCount", s: "UBaseType_t uxSemaphoreGetCount(SemaphoreHandle_t s)", d: "現在のカウント（バイナリなら 0 か 1）。" },
  { n: "vSemaphoreDelete", s: "void vSemaphoreDelete(SemaphoreHandle_t s)", d: "破棄。待ちタスクがいる状態で消してはいけない。", isr: "no" },
  { n: "xSemaphoreCreateBinaryStatic", s: "SemaphoreHandle_t xSemaphoreCreateBinaryStatic(StaticSemaphore_t *buf)\nSemaphoreHandle_t xSemaphoreCreateCountingStatic(UBaseType_t max, UBaseType_t initial, StaticSemaphore_t *buf)\nSemaphoreHandle_t xSemaphoreCreateMutexStatic(StaticSemaphore_t *buf)", d: "静的確保版。", isr: "no", cfg: "configSUPPORT_STATIC_ALLOCATION" },
]},
{ id: "mutex", title: "ミューテックス", hdr: "semphr.h",
  note: "優先度継承あり。取ったタスクが必ず返す。割り込みからは使えない。保持したまま長くブロックしない。",
  apis: [
  { n: "xSemaphoreCreateMutex", s: "SemaphoreHandle_t xSemaphoreCreateMutex(void)", d: "ミューテックスを生成。初期状態は「取得可能」。取得/解放は xSemaphoreTake / xSemaphoreGive。", isr: "no", cfg: "configUSE_MUTEXES" },
  { n: "xSemaphoreCreateRecursiveMutex", s: "SemaphoreHandle_t xSemaphoreCreateRecursiveMutex(void)", d: "同一タスクが重ねて取得できる再帰ミューテックス。Take した回数だけ Give が必要。", isr: "no", cfg: "configUSE_RECURSIVE_MUTEXES" },
  { n: "xSemaphoreTakeRecursive", s: "BaseType_t xSemaphoreTakeRecursive(SemaphoreHandle_t m, TickType_t ticksToWait)\nBaseType_t xSemaphoreGiveRecursive(SemaphoreHandle_t m)", d: "再帰ミューテックス専用の取得/解放。通常の Take/Give と混ぜてはいけない。", isr: "no", cfg: "configUSE_RECURSIVE_MUTEXES" },
  { n: "xSemaphoreGetMutexHolder", s: "TaskHandle_t xSemaphoreGetMutexHolder(SemaphoreHandle_t m)", d: "保持しているタスクを返す（誰も持っていなければ NULL）。デバッグ・アサート用。", isr: "xSemaphoreGetMutexHolderFromISR", cfg: "INCLUDE_xSemaphoreGetMutexHolder" },
]},
{ id: "notify", title: "タスク通知", hdr: "task.h",
  note: "各タスクが持つ 32bit の通知値を使った軽量な同期。オブジェクト生成が不要で速いが、受け手は 1 タスクに固定され、送り手側は満杯でブロックできない。",
  apis: [
  { n: "xTaskNotifyGive", s: "BaseType_t xTaskNotifyGive(TaskHandle_t task)", d: "通知値を +1 する。ulTaskNotifyTake と対で軽量セマフォとして使う。", isr: "vTaskNotifyGiveFromISR(task, &woken)", cfg: "configUSE_TASK_NOTIFICATIONS" },
  { n: "ulTaskNotifyTake", s: "uint32_t ulTaskNotifyTake(BaseType_t clearOnExit, TickType_t ticksToWait)", d: "通知値が 0 でなくなるまで待つ。clearOnExit=pdTRUE で 0 にクリア（バイナリ的）、pdFALSE で -1（カウンティング的）。戻り値は変更前の値で、0 ならタイムアウト。", isr: "no" },
  { n: "xTaskNotify", s: "BaseType_t xTaskNotify(TaskHandle_t task, uint32_t value, eNotifyAction action)", d: "値付きで通知。action: eNoAction / eSetBits / eIncrement / eSetValueWithOverwrite / eSetValueWithoutOverwrite（未読があれば pdFAIL）。", isr: "xTaskNotifyFromISR(task, value, action, &woken)" },
  { n: "xTaskNotifyWait", s: "BaseType_t xTaskNotifyWait(uint32_t clearOnEntry, uint32_t clearOnExit,\n                           uint32_t *outValue, TickType_t ticksToWait)", d: "通知を待って値を受け取る。clearOnEntry/Exit は待つ前/戻る前にクリアするビットマスク。タイムアウトで pdFALSE。", isr: "no" },
  { n: "xTaskNotifyStateClear", s: "BaseType_t xTaskNotifyStateClear(TaskHandle_t task)\nuint32_t ulTaskNotifyValueClear(TaskHandle_t task, uint32_t bitsToClear)", d: "保留中の通知状態、または通知値の指定ビットをクリア。", isr: "no" },
  { n: "xTaskNotifyIndexed", s: "xTaskNotifyGiveIndexed(task, index) / ulTaskNotifyTakeIndexed(index, clearOnExit, ticks)\nxTaskNotifyIndexed(task, index, value, action) / xTaskNotifyWaitIndexed(index, ...)", d: "タスクごとに複数の通知スロットを持たせる版。無印 API は index 0 を使う。", cfg: "configTASK_NOTIFICATION_ARRAY_ENTRIES" },
]},
{ id: "event", title: "イベントグループ", hdr: "event_groups.h",
  note: "複数ビットの AND / OR 待ちができる。使えるのは下位 24bit（TickType_t が 32bit のとき）。上位 8bit は内部用。",
  apis: [
  { n: "xEventGroupCreate", s: "EventGroupHandle_t xEventGroupCreate(void)", d: "イベントグループを生成。全ビット 0 で始まる。静的版は xEventGroupCreateStatic。", isr: "no" },
  { n: "xEventGroupSetBits", s: "EventBits_t xEventGroupSetBits(EventGroupHandle_t eg, EventBits_t bits)", d: "ビットを立て、待ち条件を満たしたタスクを全て起こす。", isr: "xEventGroupSetBitsFromISR(eg, bits, &woken)" },
  { n: "xEventGroupWaitBits", s: "EventBits_t xEventGroupWaitBits(EventGroupHandle_t eg, EventBits_t bitsToWaitFor,\n                                BaseType_t clearOnExit, BaseType_t waitForAllBits, TickType_t ticksToWait)", d: "ビットを待つ。waitForAllBits=pdTRUE で AND、pdFALSE で OR。タイムアウトでも値が返るので、戻り値のビットを必ず自分で判定する。", isr: "no" },
  { n: "xEventGroupClearBits", s: "EventBits_t xEventGroupClearBits(EventGroupHandle_t eg, EventBits_t bits)", d: "ビットを下ろす。戻り値はクリア前の値。", isr: "xEventGroupClearBitsFromISR(eg, bits)" },
  { n: "xEventGroupGetBits", s: "EventBits_t xEventGroupGetBits(EventGroupHandle_t eg)", d: "現在のビットを読む。", isr: "xEventGroupGetBitsFromISR(eg)" },
  { n: "xEventGroupSync", s: "EventBits_t xEventGroupSync(EventGroupHandle_t eg, EventBits_t bitsToSet,\n                            EventBits_t bitsToWaitFor, TickType_t ticksToWait)", d: "自分のビットを立てつつ全員ぶんが揃うのを待つ（ランデブー）。複数タスクの足並みを揃える用途。", isr: "no" },
  { n: "vEventGroupDelete", s: "void vEventGroupDelete(EventGroupHandle_t eg)", d: "破棄。待っていたタスクは 0 を受け取って起きる。", isr: "no" },

const content = document.getElementById("content");
const toc = document.getElementById("toc");
const empty = document.getElementById("empty");
const q = document.getElementById("q");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

for (const sec of DATA) {
  const link = el("a");
  link.href = "#" + sec.id;
  link.append(el("span", "n", String(sec.apis.length)), sec.title);
  link.dataset.sec = sec.id;
  toc.append(link);

  const s = el("section");
  s.id = sec.id;
  const h = el("h2", null, sec.title);
  h.append(el("small", null, sec.hdr));
  s.append(h);
  if (sec.note) s.append(el("p", "note", sec.note));

  for (const a of sec.apis) {
    const card = el("div", "api");
    card.id = a.n;
    card.dataset.text = (a.n + " " + a.s + " " + a.d + " " + (a.isr || "") + " " + (a.cfg || "")).toLowerCase();
    const top = el("div", "top");
    const name = el("a", "name", a.n);
    name.href = "#" + encodeURIComponent(a.n);
    top.append(name);
    if (a.isr === "no") top.append(el("span", "badge b-no", "ISR不可"));
    else if (a.isr) top.append(el("span", "badge b-isr", "ISR版: " + a.isr));
    if (a.cfg) top.append(el("span", "badge b-cfg", a.cfg));
    card.append(top, el("code", "sig", a.s), el("p", "desc", a.d));
    s.append(card);
  }
  content.append(s);
}

function filter() {
  const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
  let total = 0;
  for (const s of content.querySelectorAll("section")) {
    let shown = 0;
    for (const card of s.querySelectorAll(".api")) {
      const ok = words.every(w => card.dataset.text.includes(w));
      card.style.display = ok ? "" : "none";
      if (ok) shown++;
    }
    s.style.display = shown ? "" : "none";
    toc.querySelector('[data-sec="' + s.id + '"]').style.display = shown ? "" : "none";
    total += shown;
  }
  empty.style.display = total ? "none" : "block";
}

function firstVisible() {
  for (const card of content.querySelectorAll(".api")) {
    if (card.style.display !== "none") return card;
  }
  return null;
}

q.addEventListener("input", filter);
q.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const card = firstVisible();
    if (card) { location.hash = encodeURIComponent(card.id); q.blur(); }
  } else if (e.key === "Escape") {
    q.value = ""; filter(); q.blur();
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); q.select(); }
});

if (location.hash) {
  const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
  if (target) target.scrollIntoView();
}
</script>
